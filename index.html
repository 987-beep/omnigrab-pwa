<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OmniGrab Pro - Universal Media Downloader & PWA</title>
    
    <!-- Meta tags for SEO & Social Sharing -->
    <meta name="description" content="Download 4K videos, reels, photos, and music from any website. Progressive Web App with Android background share and Chrome Companion Extension." />
    <meta name="keywords" content="video downloader, image scraper, instagram reels download, youtube 4k download, tiktok no watermark, pwa downloader, chrome extension" />
    <meta name="author" content="OmniGrab Pro" />
    
    <!-- PWA settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniGrab" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-96x96.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-surface-950 text-slate-100 min-h-screen selection:bg-brand-500 selection:text-white font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('OmniGrab PWA ServiceWorker registered with scope:', reg.scope);
          }).catch(err => {
            console.log('OmniGrab ServiceWorker registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
