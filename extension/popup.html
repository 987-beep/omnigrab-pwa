<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniGrab Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div>
          <h1 class="app-title">OmniGrab Pro</h1>
          <span class="app-subtitle">Universal Media Sniffer</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="pwa-link-btn" class="icon-btn" title="Open in OmniGrab PWA">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Quick Actions Bar -->
    <div class="quick-bar">
      <button id="scan-page-btn" class="action-btn active">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>Sniff Active Tab</span>
      </button>
      <button id="batch-zip-btn" class="action-btn" style="display: none;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 8v13H3V8"></path>
          <path d="M1 3h22v5H1z"></path>
          <path d="M10 12h4"></path>
        </svg>
        <span>Save All as ZIP</span>
      </button>
    </div>

    <!-- Active Media List -->
    <div class="media-container" id="media-list">
      <div class="empty-state" id="loading-state">
        <div class="spinner"></div>
        <p>Scanning page for 4K/HD videos, photos & audio...</p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="media-count-label">0 items found</span>
      </div>
      <button id="extract-backend-btn" class="pwa-cta-btn">
        <span>Deep Extract with PWA Engine</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
